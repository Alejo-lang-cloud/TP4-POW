<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÉROES</title>
    <link rel="icon" type="image/png" href="../res/favicon.png">
    <link rel="stylesheet" href="../css/style_ej3.css">
</head>
<body>

    <main class="pantalla-completa">
        
        <!-- contenedor para agrupar las dos tarjetas -->
        <div class="contenedor-tarjetas">
            
            <!-- t1: buscador y foto -->
            <article class="tarjeta-comic tarjeta-foto">
                <header class="cabecera-buscador">
                    <input type="text" id="input-personaje" placeholder="EJ: BATMAN">
                    <button id="btn-buscar">BAM!</button>
                </header>

                <div id="resultado-foto" class="oculto">
                    <div class="marco-foto">
                        <img id="foto-personaje" src="" alt="Foto del personaje">
                    </div>
                </div>
                
                <div id="mensaje-estado" class="texto-comic">Ingresa un héroe para buscar.</div>
            </article>

            <!-- t2: estadisticas, inicialmente oculta -->
            <article id="resultado-info" class="tarjeta-comic tarjeta-info oculto">
                <h1 id="nombre-personaje" class="titulo-comic">--</h1>
                <h2 id="nombre-real" class="subtitulo-comic">--</h2>
                
                <hr class="linea-gruesa">
                
                <p id="desc-personaje" class="texto-comic">--</p>
                <p id="stats-combate" class="texto-comic destacado">--</p>
                
                <hr class="linea-gruesa">
                
                <p id="afiliacion-personaje" class="texto-comic">--</p>
            </article>

        </div>

    </main>

    <script src="../js/ej3.js"></script>
</body>
</html>
