<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnero Minimalista</title>
    <link rel="stylesheet" href="../css/style_ej2.css">
    <link rel="icon" type="image/png" href="../recursos/favicon-turnero-512.png">
</head>
<body>
    <main class="contenedor-brutal">
        <header>
            <h1>TURNERO</h1>
        </header>

        <section class="configuracion">
            <div class="grupo-input">
                <label for="limite-inf">Límite Inferior:</label>
                <input type="number" id="limite-inf" value="1" min="0">
            </div>
            <div class="grupo-input">
                <label for="limite-sup">Límite Superior:</label>
                <input type="number" id="limite-sup" value="100">
            </div>
        </section>

        <section class="pantalla-turno">
            <span id="mensaje-estado">Siguiente turno</span>
            <div id="numero-display" class="numero-gigante">--</div>
        </section>

        <section class="controles">
            <button id="btn-generar" class="btn btn-azul">SACAR TURNO</button>
            <button id="btn-reiniciar" class="btn btn-gris">REINICIAR SISTEMA</button>
        </section>
    </main>

    <script src="../js/ej2.js"></script>
</body>
</html>
